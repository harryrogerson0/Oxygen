<!DOCTYPE html>
<html>
    <head>
        <title>Oxygen - Version Alpha</title>
        <link rel="icon" href="Images/Web-Page/oxygen-logo.png">
        <meta charset="utf-8">
    </head>
    <body>
        <div id="navigator">
            <table id="menuButtonTable">
                <tr>
                    <td>
                        <a href="/home" class="menuButton">
                            Home
                        </a>
                    </td>
                    <td>
                        <a href="/play" class="menuButton">
                            Play
                        </a>
                    </td>
                    <td>
                        <a href="/help" class="menuButton">
                            Help
                        </a>
                    </td>
                    <td>
                        <a href="/contacts" class="menuButton">
                            Contacts
                        </a>
                    </td>
                    <td>

                    </td>
                </tr>
            </table>
        </div>
        <div id="main">
            <canvas id="canvas"></canvas>
        </div>
        <div id="footer">
            <p id="copyright">
                Copyright © Harry Rogerson 2020
            </p>
        </div>
        <style>
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
                image-rendering: pixelated;
                image-rendering: crisp-edges;
                background-image: url("Images/Web-Page/page-background.png");
                background-size: 100vw 100vh;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }
            table {
                table-layout: fixed;
            }
            td {
                text-align: center;
            }
            .menuButton {
                font-family: monospace;
                color: white;
                font-size: 3vw;
            }
            #menuButtonTable {
                width: 100vw;
                height: 7vw;
                top: 0;
            }
            #navigator {
                top: 0;
                left: 0;
                width: 100vw;
                height: 8vw;
                position: fixed;
                background-image: url("Images/Web-Page/navigator-background.png");
                background-repeat: no-repeat;
                background-size: 100% 100%;
            }
            #main {
                text-align: center;
                margin-top: 9vw;
                margin-bottom: 3vw;
            }
            #footer {
                width: 100vw;
                height: 2vw;
                left: 0;
                bottom: 0;
                text-align: center;
                background-color: dimgray;
                position: fixed;
            }
            #copyright {
                color: white;
                opacity: 0.5;
                font-family: monospace;
                font-size: 1vw;
                margin: 0.4vw;
            }
            #canvas {
                border: 2px solid black;
                border-radius: 20px;
            }
        </style>
        <script src="oxygen-version-alpha.js"></script>
    </body>
</html>
